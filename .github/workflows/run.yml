name: Build Assembly Patch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công trên web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Sửa lại đường dẫn khớp với thực tế (không có đuôi .txt)
        pip install -r src/requirements

    - name: Run Build Script
      working-directory: ./src # Chạy script bên trong thư mục src
      run: |
        python build_assembly.py

    - name: Run Verify Script
      working-directory: ./src
      run: |
        python verify.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: built-payload
        # Lấy file kết quả từ thư mục src/payload
        path: |
          src/payload/assembly-csharp-patch.bytes
          src/payload/assembly-csharp-patch.gz
          src/payload/fileinfo-line.txt
          src/payload/build-report.json
