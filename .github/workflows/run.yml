name: Build IFix Patch

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công

jobs:
  build-unity-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # Nếu project có dùng Git LFS

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Build IFix Patch
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android # Hoặc iOS tùy game
          # Custom method để gọi InjectFix Editor
          customParameters: -executeMethod IFix.Editor.IFixEditor.GenPatch -batchmode -quit
        
      - name: Upload Patch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifix-patch-file
          path: "**/Assembly-CSharp.patch.bytes" # Tìm file patch do InjectFix sinh ra
