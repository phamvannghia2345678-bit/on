name: Build & Verify Assembly Patch

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build assembly
        run: |
          python build_assembly.py

      - name: Verify
        run: |
          python verify.py

      - name: Upload payload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assembly-csharp-patch
          path: |
            payload/assembly-csharp-patch.bytes
            payload/assembly-csharp-patch.gz
            payload/fileinfo-line.txt
            payload/build-report.json
