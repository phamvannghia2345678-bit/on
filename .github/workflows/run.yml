name: Build Assembly Patch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt # <-- SỬA ĐƯỜNG DẪN Ở ĐÂY

    - name: Run Build Script
      working-directory: ./src # <-- CHẠY SCRIPT TRONG THƯ MỤC SRC
      run: |
        python build_assembly.py

    - name: Run Verify Script
      working-directory: ./src
      run: |
        python verify.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: built-payload
        path: src/payload/ # <-- LẤY FILE TỪ THƯ MỤC SRC/PAYLOAD
