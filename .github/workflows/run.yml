name: Build Assembly Patch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công trên web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Build Script
      run: |
        python build_assembly.py

    - name: Run Verify Script
      run: |
        python verify.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: built-payload
        path: |
          payload/assembly-csharp-patch.bytes
          payload/assembly-csharp-patch.gz
          payload/fileinfo-line.txt
          payload/build-report.json
