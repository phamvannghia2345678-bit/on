name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ShooterGame.zip
      - run: brew install xcodegen && xcodegen generate
        working-directory: ShooterGame
      - run: |
          xcodebuild -project ShooterGame.xcodeproj -scheme ShooterGame \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
        working-directory: ShooterGame
      - run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/ShooterGame.app Payload/
          zip -r ShooterGame.ipa Payload
        working-directory: ShooterGame
      - uses: actions/upload-artifact@v4
        with:
          name: ShooterGame
          path: ShooterGame/ShooterGame.ipa
